<goa-two-column-layout maxcontentwidth="1400px" navcolumnwidth="30ch">
  <section slot="header">
    <goa-microsite-header type="alpha" level="alpha" version="UAT"></goa-microsite-header>
    <goa-app-header heading="Design Systems" maxcontentwidth="1500px" [fullmenubreakpoint]="1700">
      <a href="/get-started">Get started
      </a>
      <a href="/patterns">Patterns and templates</a>
      <a href="/components">Components</a>
      <a href="/design-tokens">Styles</a>
      <a href="/content/capitalization">Content</a>
      <a href="/support">Support</a>
      <a href="https://github.com/GovAlta/ui-components/issues/new/choose" target="_blank">
        Report a bug
      </a>
      <a href="#">Support</a>
      <goa-app-header-menu heading="Tickets" leadingIcon="ticket">
        <a href="#">Cases</a>
        <a href="#">Payments</a>
        <a href="#">Outstanding</a>
      </goa-app-header-menu>
      <a href="#" className="interactive">Sign in</a>
    </goa-app-header>
  </section>

  <section slot="nav">
    <goab-side-menu>
<!--      <goab-side-menu-group heading="Bugs">-->

<!--      </goab-side-menu-group>-->
      <!-- <goab-side-menu-group heading="Components">
        <a routerLink="/date-picker">Date picker</a>
      </goab-side-menu-group> -->
      <a href="/modal">Go to modal</a>
    </goab-side-menu>
  </section>
  <div class="container">
    <div class="lto-container">
      <goa-spacer vspacing="3xl"></goa-spacer>

      <goa-details class="left-section" heading="Your search" [open]="true">
        <div class="search-type-container">
          <goa-form-item label="Select search type" data-testid="search-type-form-item">
            <goa-dropdown
              relative="true"
              name="searchType"
              goaValue
              [formControl]="searchTypeFormControl"
              (_change)="onSearchTypeChange($event)"
              testid="search-type-dropdown"
              width="100%"
            >
              @for (searchType of searchTypes; track searchType) {
                <goa-dropdown-item [value]="searchType.id" [label]="searchType.name"
                                   [attr.testid]="'search-type-dropdown-item-' + searchType.id"></goa-dropdown-item>
              }
            </goa-dropdown>
          </goa-form-item>
        </div>
      </goa-details>

    </div>

    <router-outlet></router-outlet>
  </div>
  <goa-app-footer slot="footer" maxcontentwidth="1400px"></goa-app-footer>
</goa-two-column-layout>
