<goab-column-layout>
  <section slot="header">
    <goab-microsite-header
      type="beta"
      version="Angular 1.0"
      feedbackUrl="https://github.com/GovAlta/ui-components/issues/new/choose">
    </goab-microsite-header>
    <goab-app-header url="/" heading="Design system templates" maxContentWidth="100%">
    </goab-app-header>
  </section>

  <goa-page-block width="100%">
    <goab-popover [target]="closeTarget" minWidth="250px">
      <p>This popover has a close icon button inside</p>
      <p>Click the icon button below to close this popover.</p>
      <goab-icon-button
        icon="close"
        variant="color"
        action="close"
        ariaLabel="Close Popover">
      </goab-icon-button>

      <ng-template #closeTarget>
        <goab-button type="primary" size="normal">
          Click to open (with close icon button)
        </goab-button>
      </ng-template>
    </goab-popover>




  </goa-page-block>

  <section slot="footer">
    <goab-app-footer maxContentWidth="100%">
      <goab-app-footer-meta-section slot="meta">
        <a href="https://goa-dio.slack.com/archives/C02PLLT9HQ9">
          Get help
        </a>
        <a href="https://goa-dio.atlassian.net/wiki/spaces/DS/pages/2342813697/Design+System+Drop-in+hours">
          Drop-in Hours
        </a>
        <a href="https://github.com/GovAlta/ui-components/issues/new/choose">
          Contribute
        </a>
      </goab-app-footer-meta-section>
    </goab-app-footer>
  </section>
</goab-column-layout>
