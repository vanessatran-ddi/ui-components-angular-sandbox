<goa-one-column-layout>
  <section slot="header">
    <goa-microsite-header
      type="beta"
      version="Angular 1.0"
      feedbackUrl="https://github.com/GovAlta/ui-components/issues/new/choose">
    </goa-microsite-header>
    <goa-app-header url="/" heading="Design system templates" maxContentWidth="100%">
    </goa-app-header>
  </section>

  <goa-page-block width="100%">
    <h3>Event Based</h3>
    <goa-block gap="m" direction="column">
      <goa-form-item label="Full Name" mb="xl">
        <goa-input
          name="fullName"
          [value]="fullName"
          type="text"
          textAlign="left"
          width="100%"
          (_change)="onChange($event)"
        ></goa-input>
      </goa-form-item>

      <goa-form-item label="Account Number" helpText="This input is right aligned." mb="xl">
        <goa-input
          name="accountNumber"
          [value]="accountNumber"
          textAlign="right"
          width="15ch"
          (_change)="onChange($event)"
        ></goa-input>
      </goa-form-item>

      <goa-form-item label="Price" helpText="The input number component is right aligned by default." mb="xl">
        <goa-input-number
          name="price"
          [value]="price"
          width="7ch"
          (_change)="onChange($event)"
        >
          <div slot="trailingContent">
            <span [style.white-space]="'nowrap'">per item</span>
          </div>
        </goa-input-number>
      </goa-form-item>

      <goa-form-item label="Quantity" helpText="You can set a number input to be left aligned." mb="xl">
        <goa-input-number
          name="quantity"
          [value]="quantity"
          textAlign="left"
          width="7ch"
          (_change)="onChange($event)"
        ></goa-input-number>
      </goa-form-item>
    </goa-block>

    <h3>Reactive forms</h3>
    <goa-block gap="m" direction="column">
      <goa-form-item label="Full Name" mb="xl">
        <goa-input
          name="fullName"
          [formControl]="fullNameFormCtrl"
          type="text"
          textAlign="left"
          width="100%"
        ></goa-input>
      </goa-form-item>

      <goa-form-item label="Account Number" helpText="This input is right aligned." mb="xl">
        <goa-input
          name="accountNumber"
          [formControl]="accountNumberFormCtrl"
          textAlign="right"
          width="15ch"
        ></goa-input>
      </goa-form-item>

      <goa-form-item label="Price" helpText="The input number component is right aligned by default." mb="xl">
        <goa-input-number
          name="price"
          [formControl]="priceFormCtrl"
          width="7ch"
        >
          <div slot="trailingContent">
            <span [style.white-space]="'nowrap'">per item</span>
          </div>
        </goa-input-number>
      </goa-form-item>

      <goa-form-item label="Quantity" helpText="You can set a number input to be left aligned." mb="xl">
        <goa-input-number
          name="quantity"
          [formControl]="quantityFormCtrl"
          textAlign="left"
          width="7ch"
        ></goa-input-number>
      </goa-form-item>
    </goa-block>
  </goa-page-block>

  <section slot="footer">
    <goa-app-footer maxContentWidth="100%">
      <goa-app-footer-meta-section slot="meta">
        <a href="https://goa-dio.slack.com/archives/C02PLLT9HQ9">
          Get help
        </a>
        <a href="https://goa-dio.atlassian.net/wiki/spaces/DS/pages/2342813697/Design+System+Drop-in+hours">
          Drop-in Hours
        </a>
        <a href="https://github.com/GovAlta/ui-components/issues/new/choose">
          Contribute
        </a>
      </goa-app-footer-meta-section>
    </goa-app-footer>
  </section>
</goa-one-column-layout>
