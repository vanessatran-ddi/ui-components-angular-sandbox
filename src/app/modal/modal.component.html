<goab-button type="secondary" (onClick)="toggleModal()"
>Save for later</goab-button
>
<goab-modal [open]="open" [heading]="heading" [actions]="actions">
  <p>
    You’ve selected to adjourn a matter that is required to appear today. This
    Calgary court location does not accept adjournment requests past 1PM MST.
    Please submit your adjournment request as soon as possible.
  </p>
  <ng-template #actions>
    <goab-button-group alignment="end">
      <div>Does this have a margin</div>
      <goab-button type="secondary" (onClick)="toggleModal()"
      >Secondary</goab-button
      >
      <goab-button type="primary" (onClick)="toggleModal()"
      >Primary</goab-button
      >
    </goab-button-group>
  </ng-template>
  <ng-template #heading>Do you agree?</ng-template>
</goab-modal>
